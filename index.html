<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Validation Practice</title><link rel="stylesheet" href="styles.css"></head><body><header><p>Validation practice</p><h1>Workshop Request</h1><p>Earliest available request date: October 1, 2026. Use fictional information only.</p></header><main><form action="" method="get"><div class="field"><label for="email">Email address (required)</label><input id="email" name="email" type="email" required></div><div class="field"><label for="attendance">Number attending (1–8)</label><input id="attendance" name="attendance" type="number" min="1" max="8" step="1" required></div><div class="field"><label for="date">Requested date</label><input id="date" name="date" type="date" min="2026-10-01"></div><div class="field"><label for="reason">Short explanation (optional, 240 characters maximum)</label><textarea id="reason" name="reason" maxlength="240"></textarea></div><button type="submit">Test request</button><button type="button" disabled>Unavailable action</button><div class="server-error"><h2>Request needs attention</h2><p id="email-error"><strong>Email address:</strong> This address could not be confirmed. Check it for typing errors and submit again.</p></div></form></main></body></html>
